name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]   # branches만 두면 태그 push는 이 워크플로를 트리거하지 않는다 — 릴리스 잡(prepare-release·publish-*)의 전제
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Job 1: 빌드 및 단위 테스트 (빠른 피드백)
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: |
        dotnet test tests/CodeBeaker.Core.Tests/ \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=core-test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults

    - name: Run runtime tests
      run: |
        dotnet test tests/CodeBeaker.Runtimes.Tests/ \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=runtime-test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults

    # Unit test projects are listed explicitly here; a new one is not picked up until
    # it is added to this workflow as well as to the solution. `WorkflowListTests`
    # fails when one is missing, so the omission surfaces as a red build rather than
    # as a project that quietly never runs on a runner.
    - name: Run command tests
      run: |
        dotnet test tests/CodeBeaker.Commands.Tests/ \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=commands-test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults

    - name: Publish code coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: always()
      with:
        files: ./TestResults/**/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Job 1b: 통합 테스트 — 런타임 이미지를 만들고 실제로 돌린다.
  #
  # 이 잡이 없으면 CodeBeaker.Integration.Tests 는 CI 에서 한 번도 실행되지 않는다.
  # 그 테스트들은 런타임 이미지가 없으면 스스로 skip 하므로, 이미지를 만들지 않은 채
  # 돌리면 "전부 통과"로 보이면서 실제로는 아무것도 검증하지 않는다 — 그래서 이미지
  # 존재를 테스트 실행 전에 강제로 확인한다.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    # build-push-action uploads a build-record artifact per build, kept for the repository's
    # default retention. Nothing reads it, and CI jobs do not upload artifacts.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build python runtime image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker/runtimes/python
        tags: codebeaker-python:latest
        load: true
        cache-from: type=gha,scope=runtime-python
        cache-to: type=gha,scope=runtime-python,mode=max

    - name: Build nodejs runtime image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker/runtimes/nodejs
        tags: codebeaker-nodejs:latest
        load: true
        cache-from: type=gha,scope=runtime-nodejs
        cache-to: type=gha,scope=runtime-nodejs,mode=max

    - name: Build golang runtime image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker/runtimes/golang
        tags: codebeaker-golang:latest
        load: true
        cache-from: type=gha,scope=runtime-golang
        cache-to: type=gha,scope=runtime-golang,mode=max

    - name: Build dotnet runtime image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker/runtimes/csharp
        tags: codebeaker-dotnet:latest
        load: true
        cache-from: type=gha,scope=runtime-dotnet
        cache-to: type=gha,scope=runtime-dotnet,mode=max

    # A missing image makes the integration tests skip instead of fail, which
    # would turn a broken build step into a green run. Fail here instead.
    - name: Verify runtime images are present
      run: |
        for image in codebeaker-python codebeaker-nodejs codebeaker-golang codebeaker-dotnet; do
          if ! docker image inspect "$image:latest" > /dev/null 2>&1; then
            echo "::error::$image:latest was not built — integration tests would silently skip."
            exit 1
          fi
        done

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run integration tests
      run: |
        set -o pipefail
        dotnet test tests/CodeBeaker.Integration.Tests/ \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=integration-test-results.trx" \
          --results-directory ./TestResults | tee integration-output.txt

    # These tests skip themselves whenever the Docker environment looks
    # unavailable, and a skip is reported as a pass. The images were verified
    # above, so any skip here means the suite decided not to run for some other
    # reason — which must not be reported as a successful verification.
    - name: Fail if any integration test was skipped
      run: |
        if grep -Eq "Skipped: *[1-9]" integration-output.txt; then
          echo "::error::Integration tests were skipped — a skipped test verifies nothing."
          grep -E "Passed!|Failed!|Skipped" integration-output.txt || true
          exit 1
        fi

  # Job 2: 코드 품질 분석
  #
  # Runs independently of `build-and-test`: it restores and builds on its own,
  # so gating it on the build only meant that a red build hid the formatting
  # verdict as well — the signal went missing exactly when it was needed.
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run code analysis
      run: dotnet format --verify-no-changes --no-restore

  # Job: 문서 링크 검사
  #
  # Independent of the build — it reads Markdown, not code — so it does not
  # wait on `build-and-test` and reports on its own.
  docs-links:
    name: Documentation Links
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Pinned to the commit v2.9.0 points at: this action runs third-party code
    # against the checkout, and a moving tag decides later what that code is.
    - name: Check links to repository files
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: --config lychee.toml "**/*.md"
        fail: true

  # Job 3: 보안 스캔
  #
  # Also independent of `build-and-test`, for the same reason: it restores on
  # its own, and a vulnerability report must not disappear behind a build error.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # Uploading the Trivy SARIF writes code-scanning results; declared rather than left to the
    # repository's default token permissions.
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    # Trivy's filesystem scan below only sees NuGet advisories through a
    # packages.lock.json, which this repo doesn't commit — without this step
    # a vulnerable PackageReference (transitive included) goes undetected by CI.
    - name: Check for vulnerable NuGet packages
      run: |
        set +e
        report=$(dotnet list package --vulnerable --include-transitive 2>&1)
        status=$?
        set -e
        echo "$report"
        if [ $status -ne 0 ]; then
          echo "::error::dotnet list package --vulnerable failed to run — treating an unreadable scan as a failure, not a pass."
          exit 1
        fi
        if echo "$report" | grep -q "has the following vulnerable packages"; then
          echo "::error::Vulnerable NuGet package(s) detected — see the report above."
          exit 1
        fi

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 4: 벤치마크 (선택적)
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Run benchmarks
      run: |
        dotnet run --project benchmarks/CodeBeaker.Benchmarks/CodeBeaker.Benchmarks.csproj \
          --configuration Release \
          --exporters json

    - name: Upload benchmark results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: benchmark-results
        retention-days: 7
        path: BenchmarkDotNet.Artifacts/**/*

  # Job 5: 릴리스 준비 (태그 푸시 시)
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests, code-quality, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    # Creating the release writes to the repository. Declared here rather than left to the
    # repository's default token permissions, which can be read-only.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Build release packages
      run: |
        dotnet publish src/CodeBeaker.API/CodeBeaker.API.csproj \
          --configuration Release \
          --output ./publish/api

    - name: Create release archive
      run: |
        tar -czf codebeaker-${{ github.ref_name }}-linux-x64.tar.gz -C ./publish .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          codebeaker-${{ github.ref_name }}-linux-x64.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 6: 런타임 이미지 빌드·푸시 (태그 푸시 시) — 로컬 빌드 없이 DockerRuntime이
  # CODEBEAKER_IMAGE_REGISTRY로 pull할 수 있도록 GHCR에 발행한다.
  publish-runtime-images:
    name: Publish Runtime Images
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests, code-quality, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    # build-push-action uploads a build-record artifact per build, kept for the repository's
    # default retention. Nothing reads it, and CI jobs do not upload artifacts.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      matrix:
        include:
          - name: python
            path: docker/runtimes/python
          - name: nodejs
            path: docker/runtimes/nodejs
          - name: golang
            path: docker/runtimes/golang
          - name: dotnet
            path: docker/runtimes/csharp

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ matrix.name }} runtime image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ matrix.path }}
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/codebeaker-${{ matrix.name }}:latest
          ghcr.io/${{ github.repository_owner }}/codebeaker-${{ matrix.name }}:${{ github.ref_name }}

  # Job 7: nuget.org 발행 (태그 푸시 시) — 인증은 nuget.org Trusted Publishing(GitHub OIDC → 1시간짜리 임시 API 키).
  # 장기 API 키 시크릿을 두지 않는다. 1회 선행 조건(사람): nuget.org에 정책 등록(Repository Owner/Repository/Workflow File
  # = 이 리포/ci.yml) + 리포 시크릿 NUGET_USER(nuget.org 프로필명). 절차 전체는 docs/RELEASING.md.
  # 버전의 단일 출처는 Directory.Build.props의 <Version>이다 — 태그는 트리거일 뿐이며 불일치하면 발행 전에 실패한다.
  publish-nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests, code-quality, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write   # GitHub OIDC 토큰 발급 — NuGet/login이 임시 API 키로 교환한다
      contents: read
    env:
      PACKABLE_PROJECTS: >-
        src/CodeBeaker.Core/CodeBeaker.Core.csproj
        src/CodeBeaker.Commands/CodeBeaker.Commands.csproj
        src/CodeBeaker.Runtimes/CodeBeaker.Runtimes.csproj

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Assert tag matches the release <Version>
      run: |
        tag_version="${GITHUB_REF_NAME#v}"
        props=Directory.Build.props
        version=$(grep -o '<Version>[^<]*</Version>' "$props" | sed -e 's/<Version>//' -e 's,</Version>,,')
        if [ -z "$version" ]; then
          echo "::error file=$props::no <Version> element found - the release version is declared here."
          exit 1
        elif [ "$version" != "$tag_version" ]; then
          echo "::error file=$props::<Version> is '$version' but the tag is 'v$tag_version' - bump $props (and CHANGELOG) before tagging."
          exit 1
        fi
        echo "$props: $version == v$tag_version"

    - name: Pack
      run: |
        for proj in $PACKABLE_PROJECTS; do
          dotnet pack "$proj" --configuration Release --output ./artifacts/nuget
        done
        ls -l ./artifacts/nuget

    # 임시 키는 1시간 유효 — push 직전에 받는다.
    - name: NuGet login (OIDC -> short-lived API key)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push packages to nuget.org
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push "./artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
