version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Moq"
          - "Testcontainers*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    ignore:
      # FluentAssertions moved to a paid commercial license in 8.0.0; staying on
      # the last Apache-2.0 line is a licensing decision, not a maintenance one,
      # so it is made deliberately rather than by an automated bump.
      - dependency-name: "FluentAssertions"
      # Same test-platform migration trap as elsewhere: the 4.x visualstudio runner
      # belongs to the xunit v3 line (this repo is on v2), which requires
      # Microsoft.Testing.Platform, and the coverlet collector is replaced rather
      # than upgraded when leaving VSTest.
      - dependency-name: "xunit.runner.visualstudio"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet.collector"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
