version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Moq"
          - "Testcontainers*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    ignore:
      # FluentAssertions moved to a paid commercial license in 8.0.0; staying on
      # the last Apache-2.0 line is a licensing decision, not a maintenance one,
      # so it is made deliberately rather than by an automated bump.
      - dependency-name: "FluentAssertions"
      # Same test-platform migration trap as elsewhere: the 4.x visualstudio runner
      # belongs to the xunit v3 line (this repo is on v2), which requires
      # Microsoft.Testing.Platform, and the coverlet collector is replaced rather
      # than upgraded when leaving VSTest.
      - dependency-name: "xunit.runner.visualstudio"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet.collector"

  # The sandbox runtime images are published for anyone to pull, so the language
  # generation each one is built from is a shipped artifact rather than a local
  # build detail. Nothing was watching them, and a base image can sit years past
  # end of life with nothing in the repository reporting it. The catalog-sync tests
  # keep the four restatements of a generation consistent with each other, but four
  # consistent restatements of an unsupported generation still pass — noticing that
  # the generation itself has aged is what this watches for.
  #
  # `directories` globs, so a runtime image added later is watched without anyone
  # remembering to list it here; `docker/runtimes/*` is exactly the set of image
  # definitions, which `EveryRuntimeImageDirectory_IsCoveredByTheCatalog` asserts.
  # The images are deliberately left ungrouped and major bumps are not ignored: a
  # generation change is what alters the sandbox user code runs in, so each one is
  # its own decision and belongs in its own pull request.
  #
  # Expect these pull requests to arrive red: an update edits the `FROM` line and
  # nothing else, which is exactly what the catalog-sync tests fail on. That is the
  # guard working — the fix is to move `LanguageCatalog`'s version with the image in
  # the same pull request, never to relax the test.
  - package-ecosystem: "docker"
    directories:
      - "/docker/runtimes/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
