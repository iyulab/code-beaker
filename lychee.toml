# Link checking for the repository's Markdown.
#
# Offline only: this checks that links to files inside the repository resolve.
# It deliberately does not reach the network — an external URL going down is a
# fact about the internet, not a reason to fail this repository's build, and a
# check that fails for reasons no commit can fix gets ignored, then removed.
#
# The failure this exists for: docs pointing at repository files that were
# renamed or deleted. That happened here — release notes referencing a
# deployment guide that was never committed, and four documents pointing at a
# release-notes file after it was removed.

offline = true
no_progress = true

# Only the parts of `docs-site/` that Docusaurus owns are excluded: its content
# is validated at build time (`onBrokenLinks`), and its site routes
# (`/docs/intro`) are not files, so they cannot be resolved from disk.
# `docs-site/docs` is generated by the sync script and is not tracked.
# `docs-site/README.md` is a hand-written tracked document, so it stays covered.
exclude_path = [
  "docs-site/docs",
  "docs-site/blog",
  "docs-site/build",
  "docs-site/.docusaurus",
  "docs-site/node_modules",
  "node_modules",
]
